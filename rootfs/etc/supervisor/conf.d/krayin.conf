; Web server, PHP, queue workers and the scheduler share one container.
;
; Railway volumes are 1:1 with a service, and Krayin's Data Transfer jobs read
; the uploaded CSV/XLSX back through Storage::disk('public')->path() — a local
; filesystem call no object-storage disk can answer. A separate worker service
; would get its own empty volume and every import would fail to find its file.
;
; Every program logs to the container's stdout/stderr: a supervisord program
; that declares no stdout_logfile writes to a temp file nobody reads, so a
; component that refuses to start would show in `railway logs` as nothing but
; "exited: <name> (exit status 1)".

[program:php-fpm]
command=/usr/local/sbin/php-fpm -F --fpm-config /usr/local/etc/php-fpm.conf
autostart=true
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue-worker]
command=/usr/local/bin/php /var/www/krayin/artisan queue:work --queue=%(ENV_QUEUE_NAMES)s --sleep=3 --tries=3 --backoff=10 --timeout=300 --max-time=3600
directory=/var/www/krayin
user=www-data
numprocs=%(ENV_QUEUE_WORKERS)s
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stopwaitsecs=310
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; schedule:work has no leader election, so this service must stay at one
; replica — two would run every scheduled command twice.
[program:scheduler]
command=/usr/local/bin/php /var/www/krayin/artisan schedule:work
directory=/var/www/krayin
user=www-data
autostart=true
autorestart=true
stopwaitsecs=60
priority=25
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
