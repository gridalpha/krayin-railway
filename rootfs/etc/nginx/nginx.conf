# nginx for Krayin on Railway. The placeholders below, and the listen port in
# conf.d/krayin.conf, are substituted by railway-entrypoint.sh before nginx
# starts; `worker_processes auto` would read the host's 48 cores rather than the
# container's CPU quota. The entrypoint fails closed if any placeholder survives,
# so no comment in these files may spell one out.

user www-data;
worker_processes __WORKER_PROCESSES__;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens      off;

    client_max_body_size __CLIENT_MAX_BODY_SIZE__;
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    # Railway's edge overwrites a client-supplied X-Forwarded-For, so the
    # LEFTMOST entry is the real caller. Its own entry is appended on the right
    # and rotates per request within a public range, which is why realip /
    # real_ip_recursive must not be used here — they walk right to left and land
    # on an address that changes between requests, silently destroying any
    # per-IP rate limit or audit trail.
    map $http_x_forwarded_for $real_client_ip {
        '~^\s*(?P<first>[^,\s]+)'  $first;
        default                    $remote_addr;
    }

    map $http_x_forwarded_proto $https_flag {
        https    on;
        default  '';
    }

    log_format railway '$real_client_ip - [$time_local] "$request" $status '
                       '$body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /dev/stdout railway;

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types        text/plain text/css text/xml text/javascript
                      application/json application/javascript application/xml
                      application/xml+rss image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
