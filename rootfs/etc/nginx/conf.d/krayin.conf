# The listen port placeholder below is substituted by railway-entrypoint.sh from
# Railway's $PORT.
#
# Every add_header lives in this one server block and none of the location
# blocks declares one: nginx drops the whole inherited set the moment a block
# adds a header of its own, so an `add_header Cache-Control` on the asset
# location would silently strip the security headers from every asset response.
# `expires` is safe — it does not reset the inherited list.

server {
    listen      __PORT__ default_server;
    listen      [::]:__PORT__ default_server;
    server_name _;

    root  /var/www/krayin/public;
    index index.php;
    charset utf-8;

    add_header X-Frame-Options        "SAMEORIGIN"                  always;
    add_header X-Content-Type-Options "nosniff"                     always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Uploaded media and the published package assets. The fallback is
    # /index.php rather than =404 so a route that generates a file on demand
    # still reaches Laravel instead of being answered 404 by nginx.
    location ~* \.(?:css|js|mjs|png|jpe?g|gif|ico|svg|webp|avif|woff2?|ttf|eot|map)$ {
        expires 1y;
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass 127.0.0.1:9000;

        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;
        include       fastcgi_params;

        fastcgi_hide_header X-Powered-By;

        fastcgi_buffering     on;
        fastcgi_buffer_size   32k;
        fastcgi_buffers       16 16k;
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout    300s;
        fastcgi_read_timeout    300s;
    }

    # Nothing but the front controller is executable.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
