; upload_max_filesize and post_max_size are PHP_INI_PERDIR, so ini_set() from
; application code silently does nothing and the container would keep PHP's 2 MB
; default — which is under the size of a realistic contact or lead import.

memory_limit = 512M
max_execution_time = 300
max_input_time = 300
max_input_vars = 5000

upload_max_filesize = 64M
post_max_size = 68M

expose_php = Off
date.timezone = UTC

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

; Errors belong in the deploy log, never in an HTTP response.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
