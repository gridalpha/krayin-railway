; Sorts after the image's own zz-docker.conf, so these win.
;
; pm.max_children is rewritten by railway-entrypoint.sh from the container's
; cgroup memory limit — the values here are only what a container with no limit
; would get.

[www]
user  = www-data
group = www-data

listen = 127.0.0.1:9000

; php-fpm's stock pool ships `clear_env = yes`, which empties the environment
; every worker sees — Railway's injected variables would never reach PHP.
clear_env = no

pm                   = dynamic
pm.max_children      = 12
pm.start_servers     = 3
pm.min_spare_servers = 3
pm.max_spare_servers = 6
pm.max_requests      = 500

; Without this the container's PHP errors go to a file nobody reads.
catch_workers_output = yes
decorate_workers_output = no
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
